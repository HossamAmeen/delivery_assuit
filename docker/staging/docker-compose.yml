# Staging stack (server only): backend, PostgreSQL, Redis, Celery worker and beat.
# WRITTEN BUT NOT RUN. Redis/Celery readiness must be verified on the staging server
# (docs/TODO.md). Usage: docker compose -f docker/staging/docker-compose.yml --env-file .env.staging up -d --build
# Static files and TLS/Nginx are handled by the DevOps stage (systemd/Nginx), not here.
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.staging
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  DATABASE_URL: postgres://${POSTGRES_USER:-delivery}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-delivery}
  HEALTH_CHECK_PASSWORD: ${HEALTH_CHECK_PASSWORD:?set HEALTH_CHECK_PASSWORD}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  RATELIMIT_CACHE_URL: redis://redis:6379/2
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  # Behind one reverse proxy (Nginx): trust exactly one X-Forwarded-For hop (VULN-001).
  NUM_PROXIES: ${NUM_PROXIES:-1}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: docker/staging/Dockerfile
    environment: *backend-env
    # VULN-013 / TASK-043: loopback only. NUM_PROXIES=1 trusts X-Forwarded-For, so the app must be
    # reachable only through Nginx (host Nginx proxies to 127.0.0.1:${BACKEND_PORT}). Never publish
    # this on 0.0.0.0. A containerised Nginx should join the compose network and use backend:8000.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: ../../backend
      dockerfile: docker/staging/Dockerfile
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  celery-beat:
    build:
      context: ../../backend
      dockerfile: docker/staging/Dockerfile
    # The schedule file goes to /tmp: /app is not writable by the non-root app user.
    command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  db_data:
