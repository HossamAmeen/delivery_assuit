# Nginx proxy header snippet for the backend (VULN-013 / TASK-043). Include inside the
# `location /api/` (and /admin/) blocks that proxy_pass to the backend, e.g.:
#   proxy_pass http://127.0.0.1:8000;      # host Nginx; or http://backend:8000 inside the compose network
#   include /etc/nginx/snippets/nginx-proxy-headers.conf;
#
# X-Forwarded-For is OVERWRITTEN with the TCP peer address, never appended to a client-supplied
# value. This gives exactly one trusted hop, so the backend must run with NUM_PROXIES=1.
# If another proxy (CDN, load balancer) is placed in front, NUM_PROXIES and this file must change together.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host              $host;
